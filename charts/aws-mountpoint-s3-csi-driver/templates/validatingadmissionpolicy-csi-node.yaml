{{- if and .Values.node.validatingAdmissionPolicy.enabled (semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version) }}
{{- $nodeSA := printf "system:serviceaccount:%s:%s" .Release.Namespace .Values.node.serviceAccount.name }}
{{- $taintKey := "s3.csi.aws.com/agent-not-ready" }}
# Limits the CSI driver's service account to removing the s3.csi.aws.com/agent-not-ready taint from the Node its pod
# runs on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: s3-csi-driver-node
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nodes", "nodes/*"]
  matchConditions:
    - name: node-service-account
      expression: request.userInfo.username == {{ $nodeSA | quote }}
  variables:
    # the name of the node the pod that requested the service account token runs on
    - name: nodeName
      expression: >-
        request.userInfo.?extra[?'authentication.kubernetes.io/node-name'].orValue([]).size() == 1 ?
        request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''
    - name: isUpdate
      expression: request.operation == 'UPDATE' && request.?subResource.orValue('') == ''
    - name: oldTaints
      expression: "variables.isUpdate ? oldObject.spec.?taints.orValue([]) : []"
    - name: newTaints
      expression: "variables.isUpdate ? object.spec.?taints.orValue([]) : []"
  validations:
    - expression: variables.nodeName != ''
      message: the service account token is not bound to a pod on a node
    - expression: variables.isUpdate
      message: the Mountpoint for S3 CSI driver's service account may only update Node objects
    - expression: request.name == variables.nodeName
      messageExpression: "'the Mountpoint for S3 CSI driver pod on ' + variables.nodeName + ' may only update its own Node object, not ' + request.name"
    - expression: >-
        !variables.isUpdate || (
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
        object.spec.all(k, k == 'taints' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == 'taints' || k in object.spec))
      message: the Mountpoint for S3 CSI driver's service account may only change the taints of the Node its pod runs on
    - expression: >-
        variables.newTaints.all(t, t in variables.oldTaints) &&
        variables.oldTaints.all(t, t.key == {{ $taintKey | quote }} || t in variables.newTaints)
      message: the Mountpoint for S3 CSI driver's service account may only remove the s3.csi.aws.com/agent-not-ready taint from the Node its pod runs on
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: s3-csi-driver-node
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  policyName: s3-csi-driver-node
  validationActions: ["Deny"]
{{- end }}
