{{- if .Values.controller.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-role
  namespace: {{ .Values.mountpointPod.namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
rules:
  # In daemonset (drain-only) mode the controller never spawns Mountpoint Pods, so `create` is
  # dropped; it only gets/updates (needs-unmount annotation), lists/watches, and deletes them.
  - apiGroups: [""]
    resources: ["pods"]
    {{- if eq .Values.experimental.mounterMode "daemonset" }}
    verbs: ["get", "watch", "delete", "list", "update"]
    {{- else }}
    verbs: ["get", "create", "watch", "delete", "list", "update"]
    {{- end }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-role-binding
  namespace: {{ .Values.mountpointPod.namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: s3-csi-driver-controller-role
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-cluster-role
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
rules:
  # `pods` reads are needed in all modes (drain-only lists pods to find terminated workloads).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "watch", "list"]
  {{- if ne .Values.experimental.mounterMode "daemonset" }}
  # PVCs, PVs and ServiceAccounts are only read on the spawn path (resolving bound PVs and the
  # workload's IRSA role ARN). Drain-only mode never spawns Mountpoint Pods, so it doesn't need them.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes", "serviceaccounts"]
    verbs: ["get", "watch", "list"]
  {{- end }}
  # In daemonset (drain-only) mode the controller never creates S3PAs, so `create` is dropped;
  # it only prunes stale workload references, updates, and deletes emptied S3PAs.
  - apiGroups: ["s3.csi.aws.com"]
    resources: ["mountpoints3podattachments"]
    {{- if eq .Values.experimental.mounterMode "daemonset" }}
    verbs: ["delete", "update", "get", "watch", "list"]
    {{- else }}
    verbs: ["create", "delete", "update", "get", "watch", "list"]
    {{- end }}
{{- if .Values.experimental.reserveHeadroomForMountpointPods }}
  # If `reserveHeadroomForMountpointPods` is enabled, the CSI Driver needs to add labels and remove scheduling gates
  # from the Workload Pods, therefore, it needs cluster-wide patch permission on pods.
  # See https://github.com/awslabs/mountpoint-s3-csi-driver/blob/main/docs/HEADROOM_FOR_MPPOD.md for more details.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
{{- end }}

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-cluster-role-binding
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: s3-csi-driver-controller-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["aws-s3-csi-controller"]
    verbs: ["get", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: s3-csi-driver-controller-leader-election-role-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: s3-csi-driver-controller-leader-election-role
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
