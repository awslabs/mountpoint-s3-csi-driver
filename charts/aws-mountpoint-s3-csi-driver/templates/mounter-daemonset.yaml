{{- if eq .Values.experimental.mounterMode "daemonset" }}
{{- if ne (len .Values.daemonsetMounters) 1 }}
{{- fail "daemonsetMounters must have exactly one entry" }}
{{- end }}
{{- $mounter := index .Values.daemonsetMounters 0 }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: s3-csi-daemonset-mounter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  updateStrategy:
    # We use OnDelete strategy because restarting this pod disrupts ALL active mounts on the node.
    # Mounter pods will continue running the previous version until the pod is manually restarted.
    type: OnDelete
  selector:
    matchLabels:
      app: s3-csi-daemonset-mounter
      {{- include "aws-mountpoint-s3-csi-driver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: s3-csi-daemonset-mounter
        {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 8 }}
        {{- with $mounter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The mounter runs mount-s3 only; it needs no node network namespace. With hostNetwork: false
      # IMDS (169.254.169.254) is unreachable unless the node's IMDS hop limit is >= 2, keeping node
      # credentials out of reach of this unprivileged pod.
      hostNetwork: false
      # The mounter never calls the Kubernetes API, so it needs no ServiceAccount token mounted.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.node.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- if $mounter.cache }}
      securityContext:
        # An unprivileged container needs a group owning the volume the kubelet provisions for it,
        # or a `cache.type: ephemeral` volume arrives `root:root 0755` and Mountpoint cannot write.
        # TODO: Check if we need to disable on ROSA like in v2. (Remove TODO after e2e test on CI
        # Or if it's covered by process isolation task).
        fsGroup: 1000
      {{- end }}
      {{- with $mounter.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if $mounter.tolerateAllTaints | default .Values.node.tolerateAllTaints }}
        - operator: Exists
        {{- else if $mounter.defaultTolerations | default .Values.node.defaultTolerations }}
        - key: CriticalAddonsOnly
          operator: Exists
        - key: s3.csi.aws.com/agent-not-ready
          operator: Exists
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        {{- end }}
        {{- with $mounter.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $mounter.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: mounter
        image: {{ include "csiDriverImageName" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/aws-s3-csi-daemonset-mounter
        args:
          - --comm-dir=/comm
          - --mountpoint-bin-dir=/mountpoint-s3/bin
          - --v={{ $mounter.logLevel }}
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: comm
            mountPath: /comm
          {{- if $mounter.cache }}
          - name: cache
            mountPath: /cache
          {{- end }}
        {{- with $mounter.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      - name: comm
        emptyDir: {}
      {{- if $mounter.cache }}
      - name: cache
        {{- $cacheType := required "daemonsetMounters[0].cache.type is required when a cache block is set: \"emptyDir\" or \"ephemeral\"" $mounter.cache.type }}
        {{- if eq $cacheType "emptyDir" }}
        {{- $emptyDir := default (dict) $mounter.cache.emptyDir }}
        {{- if and $emptyDir.medium (ne $emptyDir.medium "Memory") }}
        {{- fail (printf "daemonsetMounters[0].cache.emptyDir.medium must be \"\" (node disk) or \"Memory\" (tmpfs), got %q. A HugePages medium is backed by hugetlbfs, which Mountpoint cannot write cache blocks into" $emptyDir.medium) }}
        {{- end }}
        emptyDir:
          medium: {{ $emptyDir.medium | default "" | quote }}
          sizeLimit: {{ required "daemonsetMounters[0].cache.emptyDir.sizeLimit is required when cache.type is \"emptyDir\"" $emptyDir.sizeLimit }}
        {{- else if eq $cacheType "ephemeral" }}
        {{- $ephemeral := default (dict) $mounter.cache.ephemeral }}
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels:
                s3.csi.aws.com/type: local-ephemeral-cache
            spec:
              accessModes: ["ReadWriteOnce"]
              volumeMode: Filesystem
              storageClassName: {{ required "daemonsetMounters[0].cache.ephemeral.storageClassName is required when cache.type is \"ephemeral\"" $ephemeral.storageClassName | quote }}
              resources:
                requests:
                  storage: {{ required "daemonsetMounters[0].cache.ephemeral.size is required when cache.type is \"ephemeral\"" $ephemeral.size }}
        {{- else }}
        {{- fail (printf "daemonsetMounters[0].cache.type must be \"emptyDir\" or \"ephemeral\", got %q" $cacheType) }}
        {{- end }}
      {{- end }}
{{- end }}
