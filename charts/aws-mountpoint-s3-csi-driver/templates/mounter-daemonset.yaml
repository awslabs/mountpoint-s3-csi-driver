{{- if eq .Values.experimental.mounterMode "daemonset" }}
{{- if ne (len .Values.daemonsetMounters) 1 }}
{{- fail "daemonsetMounters must have exactly one entry" }}
{{- end }}

{{- /* ================================ Inputs ================================ */}}
{{- $mounter := index .Values.daemonsetMounters 0 }}
{{- $resources := $mounter.resources | default dict }}
{{- $requests := $resources.requests | default dict }}
{{- $maxVolumes := int $mounter.maxVolumesPerNode }}
{{- $strategies := list "equalSplit" "none" }}
{{- $memoryStrategy := $mounter.memoryLimitStrategy | default "" }}
{{- $cacheEnabled := hasKey $mounter "cache" }}
{{- $cache := $mounter.cache | default dict }}
{{- $cacheEmptyDir := $cache.emptyDir | default dict }}
{{- $cacheEphemeral := $cache.ephemeral | default dict }}
{{- $cacheMedium := $cacheEmptyDir.medium | default "" }}
{{- $cacheStrategy := $cache.limitStrategy | default "" }}
{{- /* Only a missing size is empty: `| default` would also read a sizeLimit of 0 as unset. */}}
{{- $cacheSize := hasKey $cache "emptyDir" | ternary $cacheEmptyDir.sizeLimit $cacheEphemeral.resourceRequests }}
{{- $cacheCapacity := ternary "" (toString $cacheSize) (kindIs "invalid" $cacheSize) }}

{{- /* ======================= Cache volume: validation ======================= */}}
{{- if $cacheEnabled }}
{{- if eq (hasKey $cache "emptyDir") (hasKey $cache "ephemeral") }}
{{- fail "daemonsetMounters[]: cache must set exactly one of emptyDir or ephemeral." }}
{{- end }}
{{- if hasKey $cache "emptyDir" }}
{{- if and $cacheMedium (ne $cacheMedium "Memory") }}
{{- fail (printf "daemonsetMounters[]: cache.emptyDir.medium must be \"\" (node disk) or \"Memory\" (tmpfs), got %q. A HugePages medium is backed by hugetlbfs, which Mountpoint cannot write cache blocks into" $cacheMedium) }}
{{- end }}
{{- if and (kindIs "invalid" $cacheEmptyDir.sizeLimit) (eq $cacheStrategy "equalSplit") }}
{{- fail "daemonsetMounters[]: cache.emptyDir.sizeLimit is required when cache.limitStrategy is \"equalSplit\", which divides it between the maxVolumesPerNode Mountpoint processes" }}
{{- end }}
{{- else }}
{{- if not $cacheEphemeral.storageClassName }}
{{- fail "daemonsetMounters[]: cache.ephemeral.storageClassName is required when the cache block sets ephemeral" }}
{{- end }}
{{- if kindIs "invalid" $cacheEphemeral.resourceRequests }}
{{- fail "daemonsetMounters[]: cache.ephemeral.resourceRequests is required when the cache block sets ephemeral" }}
{{- end }}
{{- end }}
{{- end }}

{{- /* ============ Cache limit (cache.limitStrategy): validation ============ */}}
{{- if $cacheEnabled }}
{{- if not (has $cacheStrategy $strategies) }}
{{- fail (printf "daemonsetMounters[]: cache.limitStrategy must be one of %v, got %q. \"equalSplit\" (recommended) gives every Mountpoint process on the node an equal share of the cache volume as its --max-cache-size; \"none\" leaves --max-cache-size to each PV's mountOptions." $strategies $cacheStrategy) }}
{{- end }}
{{- if and (eq $cacheStrategy "equalSplit") (le $maxVolumes 0) }}
{{- fail (printf "daemonsetMounters[]: maxVolumesPerNode is required and must be greater than 0 when cache.limitStrategy=equalSplit, got %d: it is the divisor for the cache volume's size. If you require maxVolumesPerNode: 0 (disabling the limit), you may use cache.limitStrategy=none, and set --max-cache-size in each PV's mountOptions to prevent unbounded cache growth." $maxVolumes) }}
{{- end }}
{{- /* Best-effort: a quantity this chart cannot parse skips the check. */}}
{{- $cacheBytes := include "aws-mountpoint-s3-csi-driver.quantityBytes" $cacheCapacity }}
{{- if and (eq $cacheStrategy "equalSplit") $cacheBytes }}
{{- $cacheShareMiB := divf (mulf (float64 $cacheBytes) 95.0) (mulf 100.0 (mulf (float64 $maxVolumes) 1048576.0)) | floor | int64 }}
{{- if le (int64 $cacheShareMiB) 0 }}
{{- fail (printf "daemonsetMounters[]: cache volume of %v, less 5%% headroom, split across maxVolumesPerNode=%d gives each Mountpoint process no whole MiB of --max-cache-size. Raise cache.emptyDir.sizeLimit or cache.ephemeral.resourceRequests, or lower maxVolumesPerNode." $cacheCapacity $maxVolumes) }}
{{- end }}
{{- end }}
{{- end }}

{{- /* =========== Memory target (memoryLimitStrategy): validation =========== */}}
{{- /* A Memory-medium emptyDir is a tmpfs, charged to this container's memory like the Mountpoints. */}}
{{- $tmpfsMiB := 0 }}
{{- if eq $cacheMedium "Memory" }}
{{- $tmpfsBytes := include "aws-mountpoint-s3-csi-driver.quantityBytes" $cacheCapacity }}
{{- if $tmpfsBytes }}
{{- $tmpfsMiB = divf (float64 $tmpfsBytes) 1048576.0 | floor | int64 }}
{{- end }}
{{- end }}
{{- $tmpfsReserved := ternary (printf " and the %d MiB tmpfs cache volume" (int64 $tmpfsMiB)) "" (gt (int64 $tmpfsMiB) 0) }}
{{- $tmpfsRemedy := ternary ", or lower cache.emptyDir.sizeLimit" "" (gt (int64 $tmpfsMiB) 0) }}
{{- if not (has $memoryStrategy $strategies) }}
{{- fail (printf "daemonsetMounters[]: memoryLimitStrategy must be one of %v, got %q. \"equalSplit\" gives every Mountpoint process on the node an equal share of resources.requests.memory as its --memory-target; \"none\" leaves --memory-target to each PV's mountOptions." $strategies $memoryStrategy) }}
{{- end }}
{{- if eq $memoryStrategy "equalSplit" }}
{{- /* equalSplit reserves 64 MiB of the container's memory request for the mounter's own process, then
       divides the rest by maxVolumesPerNode, so both inputs are required. */}}
{{- if not $requests.memory }}
{{- fail "daemonsetMounters[]: resources.requests.memory is required when memoryLimitStrategy=equalSplit, which divides it between the maxVolumesPerNode Mountpoint processes the mounter hosts to give each a --memory-target. Set memoryLimitStrategy=none to leave --memory-target to each PV's mountOptions." }}
{{- end }}
{{- if le $maxVolumes 0 }}
{{- fail (printf "daemonsetMounters[]: maxVolumesPerNode is required and must be greater than 0 when memoryLimitStrategy=equalSplit, got %d: it is the divisor for resources.requests.memory. Set memoryLimitStrategy=none to leave --memory-target to each PV's mountOptions." $maxVolumes) }}
{{- end }}
{{- /* Fail early on a request that cannot work. Best-effort only: a quantity this chart cannot parse
       skips these checks, and the mounter re-checks at runtime regardless. */}}
{{- $budgetBytes := include "aws-mountpoint-s3-csi-driver.quantityBytes" $requests.memory }}
{{- if $budgetBytes }}
{{- $budgetMiB := sub (sub (divf (float64 $budgetBytes) 1048576.0 | floor | int64) 64) (int64 $tmpfsMiB) }}
{{- if le (int64 $budgetMiB) 0 }}
{{- fail (printf "daemonsetMounters[]: resources.requests.memory (%v) is at or below the 64 MiB the mounter reserves for its own process%s, leaving nothing for Mountpoint. Raise resources.requests.memory%s." $requests.memory $tmpfsReserved $tmpfsRemedy) }}
{{- end }}
{{- $shareMiB := div (int64 $budgetMiB) $maxVolumes }}
{{- if lt (int64 $shareMiB) 512 }}
{{- fail (printf "daemonsetMounters[]: resources.requests.memory (%v) leaves %d MiB after the 64 MiB reserved for the mounter process%s, which split across maxVolumesPerNode=%d gives %d MiB per Mountpoint process, below Mountpoint's minimum --memory-target of 512 MiB. Raise resources.requests.memory or lower maxVolumesPerNode%s." $requests.memory $budgetMiB $tmpfsReserved $maxVolumes $shareMiB $tmpfsRemedy) }}
{{- end }}
{{- end }}
{{- end }}

{{- /* =============================== DaemonSet =============================== */}}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: s3-csi-daemonset-mounter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  updateStrategy:
    # We use OnDelete strategy because restarting this pod disrupts ALL active mounts on the node.
    # Mounter pods will continue running the previous version until the pod is manually restarted.
    type: OnDelete
  selector:
    matchLabels:
      app: s3-csi-daemonset-mounter
      {{- include "aws-mountpoint-s3-csi-driver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: s3-csi-daemonset-mounter
        {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 8 }}
        {{- with $mounter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The mounter runs mount-s3 only; it needs no node network namespace. With hostNetwork: false
      # IMDS (169.254.169.254) is unreachable unless the node's IMDS hop limit is >= 2, keeping node
      # credentials out of reach of this unprivileged pod.
      hostNetwork: false
      # The mounter never calls the Kubernetes API, so it needs no ServiceAccount token mounted.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.node.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- with $mounter.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if .Values.node.tolerateAllTaints }}
        - operator: Exists
        {{- else if .Values.node.defaultTolerations }}
        - key: CriticalAddonsOnly
          operator: Exists
        - key: s3.csi.aws.com/agent-not-ready
          operator: Exists
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        {{- end }}
        {{- with .Values.node.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $mounter.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: mounter
        image: {{ include "csiDriverImageName" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/aws-s3-csi-daemonset-mounter
        args:
          - --comm-dir=/comm
          - --mountpoint-bin-dir=/mountpoint-s3/bin
          - --max-volumes-per-node={{ $maxVolumes }}
          - --memory-limit-strategy={{ $memoryStrategy }}
          {{- if $cacheEnabled }}
          - --cache-dir=/cache
          - --cache-limit-strategy={{ $cacheStrategy }}
          - --cache-medium={{ $cacheMedium }}
          {{- end }}
          - --v={{ $mounter.logLevel }}
        {{- if or $requests.memory $cacheCapacity }}
        env:
          {{- /* Memory target */}}
          {{- if $requests.memory }}
          - name: MOUNTER_MEMORY_REQUEST_BYTES
            valueFrom:
              resourceFieldRef:
                containerName: mounter
                resource: requests.memory
                divisor: "1"
          {{- end }}
          {{- /* Cache limit */}}
          {{- if $cacheCapacity }}
          {{- /* resourceFieldRef covers container resources only, not a volume's size, so the quantity is
                 templated in and parsed by the mounter. */}}
          - name: MOUNTER_CACHE_CAPACITY
            value: {{ $cacheCapacity | quote }}
          {{- end }}
        {{- end }}
        securityContext:
          # Root is required so the kernel clears the spawned Mountpoint process's capabilities on
          # the UID 0 -> non-0 transition
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
            add:
              - SETUID # set the UID of each spawned Mountpoint process
              - SETGID # set its GID and clear its supplementary groups
              - KILL   # signal the children on shutdown, which do not share our UID
              {{- if $cacheEnabled }}
              - CHOWN  # give the cache volume to root, and each mount's cache directory to its Mountpoint's UID
              - DAC_OVERRIDE # remove a mount's cache directory, owned by its Mountpoint's UID and closed to root
              - FOWNER # remove a sticky subdirectory a Mountpoint could have made in its cache directory
              {{- end }}
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: comm
            mountPath: /comm
          {{- /* Cache volume */}}
          {{- if $cacheEnabled }}
          - name: cache
            mountPath: /cache
          {{- end }}
        {{- with $mounter.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      - name: comm
        emptyDir: {}
      {{- /* Cache volume */}}
      {{- if $cacheEnabled }}
      - name: cache
        {{- if hasKey $cache "emptyDir" }}
        emptyDir:
          medium: {{ $cacheMedium | quote }}
          {{- if not (kindIs "invalid" $cacheEmptyDir.sizeLimit) }}
          sizeLimit: {{ $cacheEmptyDir.sizeLimit }}
          {{- end }}
        {{- else }}
        ephemeral:
          volumeClaimTemplate:
            metadata:
              labels:
                s3.csi.aws.com/type: local-ephemeral-cache
            spec:
              accessModes: ["ReadWriteOnce"]
              volumeMode: Filesystem
              storageClassName: {{ $cacheEphemeral.storageClassName | quote }}
              resources:
                requests:
                  storage: {{ $cacheEphemeral.resourceRequests }}
        {{- end }}
      {{- end }}
{{- end }}
