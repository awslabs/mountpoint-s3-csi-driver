{{- if eq .Values.experimental.mounterMode "daemonset" }}
{{- if ne (len .Values.daemonsetMounters) 1 }}
{{- fail "daemonsetMounters must have exactly one entry" }}
{{- end }}
{{- $mounter := index .Values.daemonsetMounters 0 }}
{{- $resources := $mounter.resources | default dict }}
{{- $limits := $resources.limits | default dict }}
{{- $requests := $resources.requests | default dict }}
{{- /* The mounter divides its container's memory budget — limits.memory if set, else requests.memory —
       by maxVolumesPerNode to give each Mountpoint a --memory-target. Fail early on a sizing that is
       visibly undersized. Best-effort only: an unparseable quantity skips the check, and the mounter
       refuses such mounts at runtime anyway. */}}
{{- $budget := $limits.memory }}
{{- $budgetField := "limits.memory" }}
{{- if not $budget }}
{{- $budget = $requests.memory }}
{{- $budgetField = "requests.memory" }}
{{- end }}
{{- $maxVolumes := int $mounter.maxVolumesPerNode }}
{{- if and $budget (gt $maxVolumes 0) }}
{{- $budgetBytes := include "aws-mountpoint-s3-csi-driver.memoryQuantityBytes" $budget }}
{{- if $budgetBytes }}
{{- $shareMiB := divf (divf (float64 $budgetBytes) $maxVolumes) 1048576.0 }}
{{- if lt $shareMiB 512.0 }}
{{- fail (printf "daemonsetMounters[]: resources.%s (%v) split across maxVolumesPerNode=%d gives %.0f MiB per Mountpoint process, below Mountpoint's minimum --memory-target of 512 MiB: the mounter would refuse every mount that does not set --memory-target in its PV mountOptions. Raise resources.%s or lower maxVolumesPerNode." $budgetField $budget $maxVolumes (floor $shareMiB) $budgetField) }}
{{- end }}
{{- end }}
{{- end }}
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: s3-csi-daemonset-mounter
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 4 }}
spec:
  updateStrategy:
    # We use OnDelete strategy because restarting this pod disrupts ALL active mounts on the node.
    # Mounter pods will continue running the previous version until the pod is manually restarted.
    type: OnDelete
  selector:
    matchLabels:
      app: s3-csi-daemonset-mounter
      {{- include "aws-mountpoint-s3-csi-driver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: s3-csi-daemonset-mounter
        {{- include "aws-mountpoint-s3-csi-driver.labels" . | nindent 8 }}
        {{- with $mounter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The mounter runs mount-s3 only; it needs no node network namespace. With hostNetwork: false
      # IMDS (169.254.169.254) is unreachable unless the node's IMDS hop limit is >= 2, keeping node
      # credentials out of reach of this unprivileged pod.
      hostNetwork: false
      # The mounter never calls the Kubernetes API, so it needs no ServiceAccount token mounted.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        {{- with .Values.node.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- with $mounter.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if $mounter.tolerateAllTaints | default .Values.node.tolerateAllTaints }}
        - operator: Exists
        {{- else if $mounter.defaultTolerations | default .Values.node.defaultTolerations }}
        - key: CriticalAddonsOnly
          operator: Exists
        - key: s3.csi.aws.com/agent-not-ready
          operator: Exists
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        {{- end }}
        {{- with $mounter.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $mounter.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: mounter
        image: {{ include "csiDriverImageName" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /bin/aws-s3-csi-daemonset-mounter
        args:
          - --comm-dir=/comm
          - --mountpoint-bin-dir=/mountpoint-s3/bin
          - --max-volumes-per-node={{ $mounter.maxVolumesPerNode }}
          - --v={{ $mounter.logLevel }}
        {{- if or $limits.memory $requests.memory }}
        env:
          {{- if $limits.memory }}
          - name: MOUNTER_MEMORY_LIMIT_BYTES
            valueFrom:
              resourceFieldRef:
                containerName: mounter
                resource: limits.memory
                divisor: "1"
          {{- end }}
          {{- if $requests.memory }}
          - name: MOUNTER_MEMORY_REQUEST_BYTES
            valueFrom:
              resourceFieldRef:
                containerName: mounter
                resource: requests.memory
                divisor: "1"
          {{- end }}
        {{- end }}
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: comm
            mountPath: /comm
        {{- with $mounter.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      - name: comm
        emptyDir: {}
{{- end }}
