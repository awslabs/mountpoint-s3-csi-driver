# Keeps the driver off the nodes of Auto Mode's built-in `system` NodePool, which only runs add-ons tolerating its
# CriticalAddonsOnly taint (e.g. metrics-server, or the CloudWatch agent's operator here). Auto Mode sizes those nodes
# without the mounter, whose memory request doesn't fit on them then. Instead of tolerating every taint, the driver only
# tolerates those of the nodes it serves.
node:
  tolerateAllTaints: false
  defaultTolerations: false
  tolerations:
    - key: s3.csi.aws.com/agent-not-ready
      operator: Exists
    - key: e2e.s3.csi.aws.com/pool
      operator: Exists
