on:
  workflow_call:
    inputs:
      regular_tests_only:
        description: "If true, leaves out the cells running other tests than the regular ones (`tests`)"
        required: false
        type: boolean
        default: false
    outputs:
      matrix:
        description: "Matrix"
        value: ${{ jobs.build_matrix.outputs.matrix }}

permissions:
  contents: read

jobs:
  build_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse_yaml.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Parse matrix.yaml file
        id: parse_yaml
        env:
          REGULAR_TESTS_ONLY: ${{ inputs.regular_tests_only }}
        run: |
            MATRIX=$(yq -P -o=json '.matrix' '.github/matrix.yaml')
            if [[ "${REGULAR_TESTS_ONLY}" == "true" ]]; then
              MATRIX=$(echo "${MATRIX}" | jq '.include |= map(select(has("tests") | not))')
            fi
            echo "matrix=$(echo "${MATRIX}" | jq -c)" >> $GITHUB_OUTPUT
