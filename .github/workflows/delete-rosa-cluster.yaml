name: Manual ROSA cluster cleanup

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment whose ROSA cluster to delete"
        required: true
        type: choice
        options:
          - rosa-untrusted
          - rosa-trusted

concurrency:
  group: e2e-cluster-${{ inputs.environment }}
  queue: max

jobs:
  delete_rosa_cluster:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: "${{ vars.AWS_REGION }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
      - name: Install rosa CLI
        run: tests/e2e-kubernetes/rosa/install-rosa-cli.sh
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Get ROSA Token
        uses: aws-actions/aws-secretsmanager-get-secrets@v4
        with:
          secret-ids: |
            RosaToken
      - name: Initialize Terraform
        working-directory: tests/e2e-kubernetes/rosa/
        env:
          TF_VAR_aws_region: "${{ vars.AWS_REGION }}"
          TERRAFORM_BUCKET: "${{ vars.TERRAFORM_BUCKET }}"
        run: |
          terraform init \
            -backend-config="bucket=$TERRAFORM_BUCKET" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=$TF_VAR_aws_region"
      - name: Delete OCM cluster missing from Terraform state
        # A cancelled `terraform apply` can leave the cluster in OCM but not in state.
        # `terraform destroy` then can't delete it, nor the subnets and OIDC config it uses.
        working-directory: tests/e2e-kubernetes/rosa/
        env:
          CLUSTER_NAME: "s3-csi-${{ inputs.environment }}"
        run: ./delete-orphaned-cluster.sh
      - name: Delete ROSA cluster
        working-directory: tests/e2e-kubernetes/rosa/
        env:
          TF_VAR_aws_region: "${{ vars.AWS_REGION }}"
          TF_VAR_cluster_name: "s3-csi-${{ inputs.environment }}"
          TF_VAR_rhcs_token: "${{ env.ROSATOKEN }}"
          TF_VAR_billing_account_id: ${{ secrets.ROSA_BILLING_ACCOUNT_ID }}
        run: terraform destroy --auto-approve
