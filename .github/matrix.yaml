# Changes here may need to be backported to the latest 2.x and 1.x release branches.
# Backport if AWS is removing support for an EKS version, or if we're actively choosing to support a new k8s version on
# an old release.
matrix:
  cluster-type: ["eksctl"]
  # The cluster's profile in `tests/e2e-kubernetes/scripts/profiles`, none for the regular cells. Listed here so GitHub
  # adds the profile cells in "include" rather than merging them into the regular ones.
  cluster-profile: [""]
  arch: ["x86", "arm"]
  # Canonical patches plain Ubuntu EKS AMIs only during EKS standard support, but patches pro AMIs during extended support.
  # We use UbuntuPro2404 and UbuntuPro2604 so we don't need to move each one to Pro when its standard support ends every time.
  # Check the tabs on https://cloud-images.ubuntu.com/docs/aws/eks/ to see e.g. Noble 1.33 is missing but Noble Pro 1.33 is present.
  # To check the AMI used (use eks instead of eks-pro for plain Ubuntu):
  #   aws ssm get-parameter --region us-east-1 --name /aws/service/canonical/ubuntu/eks-pro/24.04/1.33/stable/current/amd64/hvm/ebs-gp3/ami-id
  # eksctl AMI families: https://docs.aws.amazon.com/eks/latest/eksctl/custom-ami-support.html#setting-the-node-ami-family
  family:
    [
      "AmazonLinux2023",
      "Bottlerocket",
      "UbuntuPro2404",
      "UbuntuPro2604",
    ]
  kubernetes-version:
    ["1.31.0", "1.32.1", "1.33.2", "1.34.1", "1.35.0", "1.36.1", "1.37.0"]
  include:
    # Enable enforcing mode for SELinux in AL2023, it's easier to list it in "include"
    # field rather than trying to exclude all other variants.
    - family: "AmazonLinux2023"
      selinux-mode: "enforcing"
    # The scheduling tests, on one cluster per autoscaler profile. Only PRs into feature/daemonset-architecture run them,
    # as only it has the profiles, so don't backport these. When bumping `kubernetes-version`, check each autoscaler supports it.
    - cluster-type: "eksctl"
      cluster-profile: "karpenter"
      tests: "scheduling"
      arch: "x86"
      family: "AmazonLinux2023"
      kubernetes-version: "1.36.1"
    - cluster-type: "eksctl"
      cluster-profile: "cas"
      tests: "scheduling"
      arch: "x86"
      family: "AmazonLinux2023"
      kubernetes-version: "1.36.1"
    - cluster-type: "eksctl"
      cluster-profile: "automode"
      tests: "scheduling"
      arch: "x86"
      family: "AmazonLinux2023"
      kubernetes-version: "1.36.1"
  exclude:
    # Ubuntu 26.04 EKS AMIs are only published for EKS >= 1.35.
    - cluster-type: "eksctl"
      family: "UbuntuPro2604"
      kubernetes-version: "1.31.0"
    - cluster-type: "eksctl"
      family: "UbuntuPro2604"
      kubernetes-version: "1.32.1"
    - cluster-type: "eksctl"
      family: "UbuntuPro2604"
      kubernetes-version: "1.33.2"
    - cluster-type: "eksctl"
      family: "UbuntuPro2604"
      kubernetes-version: "1.34.1"

# Combinations CI no longer tests, whose clusters earlier runs or other branch runs may have left behind.
# delete-cluster.yaml deletes these as well as everything in `matrix`.
retired:
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.31.0"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.31.0"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.32.1"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.32.1"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.33.2"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.33.2"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.34.1"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.34.1"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.35.0"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.35.0"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.36.1"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
