# Changes here may need to be backported to the latest 2.x and 1.x release branches.
# Backport if AWS is removing support for an EKS version, or if we're actively choosing to support a new k8s version on
# an old release.
matrix:
  cluster-type: ["eksctl"]
  arch: ["x86", "arm"]
  # Canonical patches plain Ubuntu EKS AMIs only during EKS standard support, but patches pro AMIs during extended support.
  # We use UbuntuPro2404 so we don't need to move each one to Pro when its standard support ends every time.
  # Check the tabs on https://cloud-images.ubuntu.com/docs/aws/eks/ to see e.g. Noble 1.33 is missing but Noble Pro 1.33 is present.
  # To check the AMI used (use eks instead of eks-pro for plain Ubuntu):
  #   aws ssm get-parameter --region us-east-1 --name /aws/service/canonical/ubuntu/eks-pro/24.04/1.33/stable/current/amd64/hvm/ebs-gp3/ami-id
  # eksctl AMI families: https://docs.aws.amazon.com/eks/latest/eksctl/custom-ami-support.html#setting-the-node-ami-family
  family:
    [
      "AmazonLinux2023",
      "Bottlerocket",
      "UbuntuPro2404",
    ]
  kubernetes-version:
    ["1.31.0", "1.32.1", "1.33.2", "1.34.1", "1.35.0", "1.36.1"]
  include:
    # Enable enforcing mode for SELinux in AL2023, it's easier to list it in "include"
    # field rather than trying to exclude all other variants.
    - family: "AmazonLinux2023"
      selinux-mode: "enforcing"

# Combinations CI no longer tests, whose clusters earlier runs or other branch runs may have left behind.
# delete-cluster.yaml deletes these as well as everything in `matrix`.
retired:
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.31.0"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.31.0"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.32.1"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.32.1"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.33.2"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.33.2"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.34.1"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.34.1"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.35.0"
  - cluster-type: "eksctl"
    arch: "arm"
    family: "Ubuntu2404"
    kubernetes-version: "1.35.0"
  - cluster-type: "eksctl"
    arch: "x86"
    family: "Ubuntu2404"
    kubernetes-version: "1.36.1"
  - cluster-type: "eksctl"
    arch: "arm"
